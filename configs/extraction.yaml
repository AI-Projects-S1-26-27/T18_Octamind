# Role 2: entity / concept extraction and linking.
# Outputs go under out_dir (git-ignored, like all of data/). See src/graph/run_extraction.py.

seed: 0
processed_dir: data/processed       # Role 1's sampled <dataset>_dev.jsonl files
out_dir: data/graph/extraction
datasets: [musique, twiki, hotpotqa]

# rule = dependency-free baseline (title + capitalized spans + dates; untyped)
# llm  = Gemini, typed mentions per sentence, cached on disk (needs GEMINI_API_KEY in .env)
extractor: llm

llm:
  # Pinned 2026-11-12. gemini-2.5-flash is closed to new API users, and gemini-3.5-flash
  # allows only 20 requests/day on the free tier; flash-lite has a usable free quota.
  # Changing the model invalidates the cache (it is part of the cache key).
  model: gemini-3.5-flash-lite
  temperature: 0
  batch_size: 10                    # paragraphs per request (~10x fewer requests than 1)
  workers: 8                        # 80 paragraphs in flight; keeps Flash-Lite TPM bursts bounded
  requests_per_minute: 4000
  requests_per_day: 150000
  max_attempts: 8                   # retries per-minute 429 / 5xx with exponential backoff;
                                    # a per-day quota error stops the run (re-run resumes)
  cache_dir: data/cache/extraction  # one JSON per prompt; delete to force re-extraction

linking:
  # Merge near-duplicate names by embedding cosine. Off until the shared embed()
  # service (docs/INTERFACE.md) exists.
  embedding_merge: false
  merge_threshold: 0.92
